<div class="w-full bg-background-light dark:bg-background-dark pt-2 pb-4 px-4 sticky bottom-0">
    <div class="max-w-3xl mx-auto w-full relative">
        <div
            class="relative flex items-end w-full p-3 bg-white dark:bg-[#1c2433] border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm focus-within:ring-2 focus-within:ring-primary/20 focus-within:border-primary/50 transition-all">
            <div class="flex-1">
                <textarea
                    #messageInput
                    [ngModel]="input"
                    (ngModelChange)="onInputChange($event)"
                    (keydown.enter)="onEnterKey($event)"
                    [disabled]="loading"
                    class="w-full bg-transparent border-none text-slate-900 dark:text-white placeholder-slate-400 focus:ring-0 resize-none max-h-[200px] py-2 text-base leading-6"
                    placeholder="{{ 'sendMessage' | translate }}" rows="1" style="min-height: 24px;"></textarea>
            </div>
            <button
                *ngIf="!loading"
                (click)="onSendMessage()"
                [disabled]="!input.trim()"
                class="flex-shrink-0 p-1.5 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors ml-2 disabled:opacity-50 disabled:cursor-not-allowed mb-0.5">
                <span class="material-symbols-outlined" style="font-size: 20px;">arrow_upward</span>
            </button>
            <button
                *ngIf="loading"
                (click)="onStopResponse()"
                class="flex-shrink-0 p-1.5 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors ml-2 mb-0.5">
                <span class="material-symbols-outlined" style="font-size: 20px;">stop</span>
            </button>
        </div>
        
        <div class="text-center mt-2">
            <p class="text-[10px] text-text-secondary-light dark:text-text-secondary-dark">{{ 'aiDisclaimer' | translate }}</p>
        </div>
    </div>
</div>
