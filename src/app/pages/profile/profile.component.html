<div class="flex h-screen overflow-hidden bg-background-light dark:bg-background-dark" style="width: -webkit-fill-available;">
  <!-- Sidebar con menú de navegación -->
  <aside class="w-[260px] flex-shrink-0 bg-sidebar-light dark:bg-sidebar-dark border-r border-slate-200 dark:border-slate-800 flex flex-col h-full">
    <div class="flex-1"></div>
    <app-navigation-menu [currentPage]="'profile'"></app-navigation-menu>
  </aside>

  <!-- Contenido principal -->
  <main class="flex flex-1 flex-col h-full">
    <!-- Header -->
    <header class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-800 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
      <div class="flex items-center gap-3">
        <button 
          (click)="goBack()"
          class="flex items-center gap-2 text-slate-600 dark:text-slate-400 hover:text-primary transition-colors">
          <span class="material-symbols-outlined" style="font-size: 20px;">arrow_back</span>
          <span class="font-medium">{{ 'profile.back' | translate }}</span>
        </button>
      </div>
      <h1 class="text-xl font-bold text-slate-900 dark:text-white">{{ 'profile.title' | translate }}</h1>
      <div></div>
    </header>

    <!-- Contenido -->
    <div class="flex-1 overflow-y-auto flex items-center justify-center p-6">
      <div class="w-full max-w-lg mx-auto p-8 bg-white dark:bg-gray-800 rounded-lg border border-slate-200 dark:border-slate-700">
        <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="space-y-6">
          <div>
            <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              {{ 'profile.name' | translate }}
            </label>
            <input
              type="text"
              id="name"
              formControlName="name"
              [placeholder]="'profile.namePlaceholder' | translate"
              class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white transition-colors"
            />
            <div *ngIf="profileForm.get('name')?.invalid && profileForm.get('name')?.touched" 
                 class="text-red-500 text-sm mt-1">
              {{ 'profile.nameRequired' | translate }}
            </div>
          </div>

          <div class="flex justify-between space-x-4 pt-2">
            <button
              type="submit"
              [disabled]="profileForm.invalid || loading"
              class="flex-1 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors font-medium"
            >
              <span *ngIf="!loading">{{ 'profile.save' | translate }}</span>
              <span *ngIf="loading">{{ 'profile.saving' | translate }}</span>
            </button>

            <button
              type="button"
              (click)="deleteProfile()"
              [disabled]="loading"
              class="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors font-medium"
            >
              {{ 'profile.delete' | translate }}
            </button>
          </div>

          <div *ngIf="message" class="p-4 rounded-lg" [ngClass]="{
            'bg-green-100 text-green-700 dark:bg-green-800 dark:text-green-200': messageType === 'success',
            'bg-red-100 text-red-700 dark:bg-red-800 dark:text-red-200': messageType === 'error'
          }">
            {{ message }}
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
