<header class="relative z-30 flex items-center justify-between px-5 py-3 border-b border-slate-200 dark:border-slate-800 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
  <div class="flex items-center gap-3 min-w-0">
    <h1 class="text-lg font-bold text-slate-900 dark:text-white flex-shrink-0">{{ 'taskBuilder.title' | translate }}</h1>
    <!-- Flow icon + name (editable) -->
    <ng-container>
      <span class="text-slate-300 dark:text-slate-600 flex-shrink-0">|</span>

      <!-- Icon button (opens picker) -->
      <div class="relative">
        <button
          (click)="toggleIconPicker(); $event.stopPropagation()"
          class="size-8 rounded-lg flex items-center justify-center transition-colors hover:ring-2 hover:ring-primary/30"
          [ngClass]="[flowIconBg]"
          [title]="'taskBuilder.changeIcon' | translate">
          <span class="material-symbols-outlined" style="font-size: 18px;" [ngClass]="[flowIconColor]">{{ flowIcon }}</span>
        </button>

        <!-- Icon Picker Dropdown -->
        <div *ngIf="showIconPicker"
          (click)="$event.stopPropagation()"
          class="absolute top-full left-0 mt-2 w-72 bg-white dark:bg-gray-900 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl z-100 overflow-hidden">

          <!-- Color selector -->
          <div class="px-3 pt-3 pb-2 border-b border-slate-100 dark:border-slate-800">
            <label class="block text-[10px] font-medium text-slate-400 dark:text-slate-500 mb-1.5 uppercase tracking-wider">{{ 'taskBuilder.iconColor' | translate }}</label>
            <div class="flex flex-wrap gap-1.5">
              <button *ngFor="let color of colorOptions"
                (click)="selectColor(color)"
                class="size-6 rounded-full transition-all hover:scale-110 ring-offset-1 ring-offset-white dark:ring-offset-gray-900"
                [ngClass]="[color.preview, flowIconColor === color.iconColor ? 'ring-2 ring-slate-800 dark:ring-white scale-110' : '']"
                [title]="color.name">
              </button>
            </div>
          </div>

          <!-- Search -->
          <div class="px-3 pt-2 pb-1">
            <input
              type="text"
              [(ngModel)]="iconSearchQuery"
              [placeholder]="'taskBuilder.searchIcon' | translate"
              class="w-full px-2.5 py-1.5 text-xs bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-700 dark:text-slate-300 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
          </div>

          <!-- Icon grid -->
          <div class="px-3 py-2 max-h-48 overflow-y-auto">
            <div class="grid grid-cols-7 gap-1">
              <button *ngFor="let opt of filteredIcons"
                (click)="selectIcon(opt.icon)"
                class="size-8 rounded-lg flex items-center justify-center transition-all hover:bg-slate-100 dark:hover:bg-gray-800"
                [ngClass]="flowIcon === opt.icon ? 'bg-primary/10 ring-1 ring-primary' : ''"
                [title]="opt.label">
                <span class="material-symbols-outlined" style="font-size: 18px;" [ngClass]="[flowIconColor]">{{ opt.icon }}</span>
              </button>
            </div>
            <div *ngIf="filteredIcons.length === 0" class="text-center py-4 text-xs text-slate-400">
              {{ 'taskBuilder.noIconsFound' | translate }}
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="!editingName"
        (click)="startEditName()"
        class="group flex items-center gap-1.5 min-w-0 cursor-pointer rounded-md px-2 py-1 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
        [title]="'taskBuilder.clickToRename' | translate">
        <span class="text-sm font-medium truncate"
          [ngClass]="flowName ? 'text-slate-600 dark:text-slate-300' : 'text-slate-400 dark:text-slate-500 italic'">
          {{ flowName || ('taskBuilder.newFlowName' | translate) }}
        </span>
        <span class="material-symbols-outlined text-slate-400 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0" style="font-size: 14px;">edit</span>
      </div>
      <input *ngIf="editingName"
        type="text"
        [(ngModel)]="flowName"
        (blur)="confirmEditName()"
        (keydown)="onNameKeydown($event)"
        class="text-sm font-medium text-slate-800 dark:text-slate-200 bg-white dark:bg-gray-800 border border-primary rounded-md px-2 py-1 min-w-[160px] max-w-[300px] focus:outline-none focus:ring-2 focus:ring-primary/30"
        autofocus />
    </ng-container>
  </div>
  <div class="flex items-center gap-2">
    <!-- Run button (shown when not running) -->
    <button *ngIf="!isRunning"
      (click)="run.emit()"
      class="flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-lg transition-colors shadow-sm bg-emerald-500 hover:bg-emerald-600 text-white">
      <span class="material-symbols-outlined" style="font-size: 18px;">play_arrow</span>
      {{ 'taskBuilder.runFlow' | translate }}
    </button>
    <!-- Stop button (shown while running) -->
    <button *ngIf="isRunning"
      (click)="stop.emit()"
      class="flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-lg transition-colors shadow-sm bg-red-500 hover:bg-red-600 text-white">
      <span class="material-symbols-outlined animate-spin" style="font-size: 18px;">progress_activity</span>
      {{ 'taskBuilder.stopFlow' | translate }}
    </button>
    <button 
      (click)="save.emit()"
      [disabled]="flowSaving"
      class="flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-lg transition-colors shadow-sm"
      [class]="flowSaveSuccess 
        ? 'bg-emerald-500 text-white' 
        : flowSaving 
          ? 'bg-primary/70 text-white cursor-wait' 
          : 'bg-primary hover:bg-primary-dark text-white'">
      <span class="material-symbols-outlined" style="font-size: 18px;" [class.animate-spin]="flowSaving">{{ flowSaveSuccess ? 'check_circle' : flowSaving ? 'progress_activity' : 'save' }}</span>
      {{ (flowSaveSuccess ? 'taskBuilder.flowSaved' : 'taskBuilder.saveFlow') | translate }}
    </button>
  </div>
</header>
